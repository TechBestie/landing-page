# techbestie.id -> container techbestie-app (production), on the shared edge nginx container.
# Installed at /root/master/nginx/conf.d/techbestie.id.conf on the production server.
#
# DNS is proxied by Cloudflare (SSL/TLS mode: Full (strict)). TLS between Cloudflare and
# this server uses a Cloudflare Origin Certificate (techbestie.id + *.techbestie.id, 15 years,
# no renewal job), stored like siapstudi.com's:
#   host       /root/master/certbot/live/techbestie.id/{fullchain,privkey}.pem
#   container  /etc/certbot/live/techbestie.id/...
# Apply: docker exec nginx nginx -t && docker exec nginx nginx -s reload

server {
    listen       80;
    listen       [::]:80;
    server_name  techbestie.id www.techbestie.id;
    return 301   https://techbestie.id$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  www.techbestie.id;
    ssl_certificate     /etc/certbot/live/techbestie.id/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/techbestie.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://techbestie.id$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  techbestie.id;
    ssl_certificate     /etc/certbot/live/techbestie.id/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/techbestie.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # Real client IP from Cloudflare (only honoured when the connection comes from Cloudflare).
    # Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Picture uploads are at most 6 MB.
    client_max_body_size 8m;

    # The app sends CSP, X-Frame-Options and the other headers itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json text/javascript application/javascript image/svg+xml;
    gzip_min_length 256;

    # Runtime DNS so a redeploy (new container IP) never causes stale-IP 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $techbestie_upstream http://techbestie-app:3000;
        proxy_pass $techbestie_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
