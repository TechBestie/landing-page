# techbestie.id -> container techbestie-app (production), on the shared edge nginx.
# Written for the nginx container setup used on the shared VPS (same as travelia.id):
#   config  /root/master/nginx/conf.d/techbestie.id.conf
#   webroot /root/master/www/techbestie   (= /var/www/techbestie in the container)
#   certs   /root/master/certbot/live/techbestie.id (= /etc/certbot/live/... in the container)
# Adjust the paths if the production server differs.
# Apply: docker exec nginx nginx -t && docker exec nginx nginx -s reload

server {
    listen      80;
    listen      [::]:80;
    server_name techbestie.id www.techbestie.id;

    location /.well-known/acme-challenge/ {
        root /var/www/techbestie;
    }

    location / {
        return 301 https://techbestie.id$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.techbestie.id;
    ssl_certificate     /etc/certbot/live/techbestie.id/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/techbestie.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://techbestie.id$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name techbestie.id;
    ssl_certificate     /etc/certbot/live/techbestie.id/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/techbestie.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # Picture uploads are at most 6 MB.
    client_max_body_size 8m;

    # The app sends CSP, X-Frame-Options and the other headers itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json text/javascript application/javascript image/svg+xml;
    gzip_min_length 256;

    # Runtime DNS so a redeploy (new container IP) never causes stale-IP 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $techbestie_upstream http://techbestie-app:3000;
        proxy_pass $techbestie_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
