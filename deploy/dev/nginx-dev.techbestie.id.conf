# dev.techbestie.id -> techbestie-dev-app (127.0.0.1:5183), host nginx on the dev VPS.
# Installed at /etc/nginx/sites-available/dev.techbestie.id (symlinked in sites-enabled).
# DNS is proxied by Cloudflare (Full (strict)). TLS uses the same Cloudflare Origin
# Certificate as production (it covers *.techbestie.id), stored in /etc/ssl/techbestie.id/.
# Apply: nginx -t && systemctl reload nginx

server {
    listen      80;
    listen      [::]:80;
    server_name dev.techbestie.id;
    return 301  https://dev.techbestie.id$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dev.techbestie.id;

    ssl_certificate     /etc/ssl/techbestie.id/fullchain.pem;
    ssl_certificate_key /etc/ssl/techbestie.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # Picture uploads are at most 6 MB.
    client_max_body_size 8m;

    # The app sends CSP, X-Frame-Options and the other headers itself.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Keep the dev site out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json text/javascript application/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:5183;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
