# Development stack on the dev VPS (169.58.12.253), installed at /opt/techbestie-dev.
# CI copies this file on every deploy; edit it here, not on the server.
#
# - Own Postgres container (the dev VPS has no shared database).
# - The app listens on 127.0.0.1 only; the host nginx proxies dev.techbestie.id to it.
# - The image is built by GitHub Actions and loaded with `docker load`;
#   deploy/release.sh tags the running build as techbestie-dev:current.
name: techbestie-dev

services:
  app:
    image: techbestie-dev:current
    container_name: techbestie-dev-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      # Only nginx on this host can reach the port, so its headers are trusted.
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${HOST_PORT:-5183}:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:17-alpine
    container_name: techbestie-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
